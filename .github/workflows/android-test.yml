name: Android manager metrics verification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: metrics-4031-${{ github.ref }}
  cancel-in-progress: false
jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned Android SDK and Rust targets
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;29.0.14206865'
          rustup target add --toolchain 1.98.0 aarch64-linux-android x86_64-linux-android
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.m2/repository/org/robolectric/android-all
            ~/.m2/repository/org/robolectric/android-all-instrumented
          key: ${{ runner.os }}-robolectric-v1-metrics-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-robolectric-v1-
      - name: Verify shipping source and focused metrics behavior
        working-directory: android
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:android)" = "$(git rev-parse 980aa83ab225eff7a93b9d60d46d986ddb8a59d9:android)"
          ./gradlew --no-daemon --no-watch-fs --console=plain --stacktrace --max-workers=2 \
            -Dorg.gradle.jvmargs=-Xmx3g -PpersonaApplicationId=com.example.persona \
            -PpersonaGoogleOAuthScheme=persona.oauth.unset -PpersonaRepoRoot="$GITHUB_WORKSPACE" \
            :core:hub:test --tests 'persona.core.hub.MachineMetricsApiTest' --tests 'persona.core.hub.MachineMetricsManagersTest' \
            :app:testDebugUnitTest --tests 'persona.android.di.MergedMetricsTest' \
            :feature:machines:testDebugUnitTest --tests 'persona.feature.machines.MachinesTest' \
              --tests 'persona.feature.machines.MachinesManagersShotsTest.theListShowsOnlyTheCurrentAssistantsComputers'
      - name: Check affected Android lint
        working-directory: android
        run: |
          ./gradlew --no-daemon --no-watch-fs --console=plain --stacktrace --max-workers=2 \
            -Dorg.gradle.jvmargs=-Xmx3g -PpersonaApplicationId=com.example.persona \
            -PpersonaGoogleOAuthScheme=persona.oauth.unset -PpersonaRepoRoot="$GITHUB_WORKSPACE" :app:lintDebug
      - name: Upload exact-source reports and images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-manager-metrics-4031
          retention-days: 7
          if-no-files-found: error
          path: |
            android/**/build/reports/lint-results*
            android/**/build/reports/tests/
            android/**/build/test-results/
            android/feature/machines/build/managers-shots/*.png
