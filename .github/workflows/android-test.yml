name: Android handset verification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: handset-8742-${{ github.ref }}
  cancel-in-progress: false
jobs:
  handset:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '1'
      GRADLE_OPTS: '-Dorg.gradle.workers.max=2 -Dorg.gradle.parallel=false -Dorg.gradle.jvmargs=-Xmx3g'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned native toolchains
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;29.0.14206865'
          rustup toolchain install 1.98.0 --profile minimal
          rustup target add --toolchain 1.98.0 aarch64-linux-android x86_64-linux-android
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Build exact handset APK and check the existing voice menu contract
        working-directory: android
        run: |
          ./gradlew --max-workers=2 -Dorg.gradle.jvmargs=-Xmx3g -Pkotlin.compiler.execution.strategy=in-process -PpersonaApplicationId=com.example.persona.shots :app:assembleDebug :feature:assistant:testDebugUnitTest --tests persona.feature.assistant.AssistantMenuTest
          ./gradlew --stop
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture the real composer, attachment panel and voice menu
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          cores: 2
          ram-size: 2048M
          heap-size: 256M
          disable-animations: true
          emulator-boot-timeout: 180
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: |
            bash -euo pipefail -c 'mkdir -p /tmp/handset-8742; for style in glass brief board; do SHOTS_STYLE=$style SHOTS_PLUGINS=1 scripts/app/android.sh shots-live -s emulator-5554 --scenario scripts/app/android_adaptive_scenes/voice-handset-8742.json --theme both --out /tmp/handset-8742/$style 2>&1 | tee /tmp/handset-8742/$style-run.log || exit $?; done'
      - name: Retain exact source and native evidence
        if: always()
        timeout-minutes: 1
        run: |
          mkdir -p /tmp/handset-8742
          git rev-parse HEAD HEAD:android > /tmp/handset-8742/source.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: handset-8742
          retention-days: 7
          if-no-files-found: error
          path: |
            /tmp/handset-8742/
            android/feature/assistant/build/test-results/testDebugUnitTest/
            android/app/build/outputs/apk/debug/app-debug.apk
