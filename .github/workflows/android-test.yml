name: Recommendation shared replay verification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: whitespace-shared-9189-${{ github.ref }}
  cancel-in-progress: false
jobs:
  shared-consumers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Restore public Cargo artifacts
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            native/app-core/target
          key: core-cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/app-core/Cargo.lock', 'native/app-core/rust-toolchain.toml') }}-${{ hashFiles('native/app-core/crates/**') }}
          restore-keys: |
            core-cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/app-core/Cargo.lock', 'native/app-core/rust-toolchain.toml') }}-
      - name: Verify inputs for reused Android, JNI, component images and Swift evidence
        run: |
          git diff --exit-code fa0a209540294487b026a5d691a8ba4690510d3a HEAD -- android spec apple native/app-core/crates/persona-core/src
          echo 'Android/JNI/component and source-extracted Swift evidence retained from run 43851472764; exact input trees unchanged. Only shared replay counts/summaries were corrected.'
      - name: Replay shared fixture consumers after updating their exact totals
        run: |
          set -euo pipefail
          mkdir -p /tmp/9189-shared
          cd native/app-core
          cargo fmt --all --check 2>&1 | tee /tmp/9189-shared/format.log
          cargo test --locked -p persona-core-ffi --test projection_boundaries 2>&1 | tee /tmp/9189-shared/ffi.log
          cargo build --locked -p persona-core-ohos --example host_replay
          PERSONA_CORE_HOST_REPLAY="$GITHUB_WORKSPACE/native/app-core/target/debug/examples/host_replay" node --test --test-concurrency=1 "$GITHUB_WORKSPACE/harmony/tests/core-host/projections.test.mjs" 2>&1 | tee /tmp/9189-shared/arkts.log
          cargo build --locked --release -p persona-core-ffi
          bash scripts/test-c-abi.sh 2>&1 | tee /tmp/9189-shared/c-abi.log
          cd "$GITHUB_WORKSPACE/server"
          GOMAXPROCS=2 go test -count=1 -p 1 ./internal/proto -run '^TestResolutionFixtures$' 2>&1 | tee /tmp/9189-shared/go.log
      - name: Upload shared replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whitespace-9189-shared
          retention-days: 7
          if-no-files-found: error
          path: /tmp/9189-shared/
